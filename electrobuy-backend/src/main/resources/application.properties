# MySQL Connection Configuration
server.port=8085
spring.application.name=electrobuy-backend
spring.datasource.url=jdbc:mysql://localhost:3306/electrobuy_db
spring.datasource.username=root
spring.datasource.password=9706

# Spring Security Default User Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Razorpay Payment Gateway Configurations
# noinspection SpringProperties
razorpay.api.key=${RAZORPAY_KEY:}
# noinspection SpringProperties
razorpay.api.secret=${RAZORPAY_SECRET:}
# noinspection SpringProperties
razorpay.mock.enabled=true